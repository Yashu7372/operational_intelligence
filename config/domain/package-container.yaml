domain:
  id: package-container
  version: "1.1"
  description: Minimal semantic domain used by AI Lab 001 and AI Lab 002.

entities:
  Package:
    identity: packageId
  Container:
    identity: containerId

relationships:
  assignedTo:
    source: Package
    target: Container
    meaning: The current operational container assignment for a package.

invariants:
  - id: one-active-container
    description: A package can have at most one active container assignment.
    relationship: assignedTo
  - id: projection-matches-business-history
    description: The projected package assignment must match the relationship resolved from business-sequence event history.
    relationship: assignedTo

events:
  PACKAGE_ASSIGNED:
    effect: establish assignment
  PACKAGE_REMOVED:
    effect: remove the referenced assignment

capabilities:
  - projection.inspect
  - simulation.event-replay
  - projection.rebuild
