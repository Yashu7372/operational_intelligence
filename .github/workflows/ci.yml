name: Operational Intelligence Lab

on:
  workflow_dispatch:
  push:
    branches:
      - feature/operational-intelligence-learning-loop
  pull_request:
    branches:
      - develop

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run lab
        run: operational-intelligence-lab --json
      - name: Run tests
        run: pytest -q
      - name: Run Docker path
        run: docker compose up --build --abort-on-container-exit
      - name: Cleanup
        if: always()
        run: docker compose down
